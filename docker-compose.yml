# Local development infrastructure. Ports are bound to localhost only; credentials are for development only.
name: freezer

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: freezer
      POSTGRES_USER: freezer
      POSTGRES_PASSWORD: freezer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep their data below /var/lib/postgresql/<version>/
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freezer -d freezer"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # Dev mode keeps its data inside the container; the realm is imported again on a fresh container.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
