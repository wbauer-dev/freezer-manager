# Default credentials are for development only. See .env.example before using the app from other devices.
#
#   docker compose up -d                          PostgreSQL and Keycloak, for development
#                                                 (backend and frontend run on the host)
#   docker compose --profile app up -d --build    the whole app in containers, at FREEZER_URL
#
# FREEZER_URL is the address the app is opened with (default https://localhost:8443). To use it from
# other devices, e.g. a phone that scans labels, set it in .env (see .env.example).
#
# PostgreSQL and Keycloak listen on this computer only; other devices reach the app through nginx (frontend).
name: freezer

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: freezer
      POSTGRES_USER: freezer
      # Set when the database is first created; changing it later needs the volume removed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freezer}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep their data below /var/lib/postgresql/<version>/
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freezer -d freezer"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # The realm is imported on the first start, when the data volume is still empty; later starts keep the accounts.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Used when the admin account is first created.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Keycloak names the address it was reached with: http://localhost:8081 in development,
      # FREEZER_URL behind nginx (which sends X-Forwarded-* headers).
      KC_PROXY_HEADERS: xforwarded
      # Used in the realm file for the app's login redirect.
      FREEZER_URL: ${FREEZER_URL:-https://localhost:8443}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      # The realm to import: infra/keycloak/dev has demo users and a password-login client for curl;
      # infra/keycloak/lan has neither (for use from other devices, see .env.example).
      - ${KEYCLOAK_REALM_DIR:-./infra/keycloak/dev}:/opt/keycloak/data/import:ro

  backend:
    profiles: [app]
    build: ./backend
    image: freezer-backend:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/freezer
      SPRING_DATASOURCE_USERNAME: freezer
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-freezer}
      # Tokens come from Keycloak behind nginx; the signing keys are fetched inside the network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: ${FREEZER_URL:-https://localhost:8443}/realms/freezer
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/freezer/protocol/openid-connect/certs
      FREEZER_LABELS_SCANURL: ${FREEZER_URL:-https://localhost:8443}/s/
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    profiles: [app]
    build: ./frontend
    image: freezer-frontend:local
    environment:
      FREEZER_URL: ${FREEZER_URL:-https://localhost:8443}
    ports:
      - "8443:443"
      # Plain HTTP only redirects to FREEZER_URL.
      - "8000:80"
    volumes:
      # A self-signed certificate is created here on first start. To use your own, put tls.crt and
      # tls.key into a directory and mount it here instead.
      - nginx-certs:/etc/nginx/certs
    depends_on:
      - backend

volumes:
  postgres-data:
  # Keycloak's accounts and keys. Without it, every new container would forget all users, and users who register
  # again get a new identity that their households do not know.
  keycloak-data:
  nginx-certs:
