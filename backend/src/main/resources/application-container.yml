# Profile of the container image (backend/Dockerfile sets SPRING_PROFILES_ACTIVE=container).
# application.yml holds development defaults (local database, Keycloak on localhost:8081, the Angular dev server).
# A deployment must not run with them by accident: here every such value has to come from the environment, and the
# application refuses to start while one is missing (see RequiredContainerSettings).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI}

freezer:
  labels:
    # Printed into every QR code: a wrong value ends up on stickers.
    scan-url: ${FREEZER_LABELS_SCANURL}
