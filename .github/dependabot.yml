# Weekly dependency updates, grouped so related libraries arrive in one pull request.
# CI must pass before a pull request can be merged (branch protection on main).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      jmolecules:
        patterns: ["org.jmolecules*", "org.xmolecules*"]
      code-quality:
        patterns: ["com.puppycrawl.tools:*", "net.sourceforge.pmd:*", "org.apache.maven.plugins:maven-checkstyle-plugin", "org.apache.maven.plugins:maven-pmd-plugin"]
      other-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"]
      other-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # PostgreSQL and Keycloak images in docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
