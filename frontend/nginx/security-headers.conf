# Security headers for the app's own responses, included in each location that serves the app. (An add_header in a
# location replaces all add_header lines of the server, so they cannot simply be declared once above.) The API sets
# its own headers (Spring Security), and Keycloak's login pages bring their own policy.
#
# Content security policy:
# - Scripts, fonts and API calls stay on this origin. Keycloak is reached through this server too (/realms), and the
#   login library renews tokens with refresh tokens, a plain request, so no frames are needed.
# - Angular adds component styles as <style> elements, hence 'unsafe-inline' for styles (not for scripts). The build
#   does not inline critical CSS, which would need an inline script (angular.json).
# - Photos are shown as object URLs (blob:).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
