# Serves the Angular app and forwards API calls to the backend (docker-compose service "backend").
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Photos are uploaded through /api; the backend accepts requests up to 9 MB.
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File names with a content hash (main-ABCD1234.js) never change: cache them for good.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Translations keep their names; check for new versions.
    location /i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-side routes (/households/..., /s/<label code>) all load the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
